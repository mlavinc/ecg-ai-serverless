<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280" role="img" aria-labelledby="title desc">
  <title id="title">ECG-AI Architecture Flow</title>
  <desc id="desc">Usuario to Vercel to Lambda Function URL to S3 model</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#111"/>
    </marker>
  </defs>

  <!-- White canvas -->
  <rect width="980" height="280" fill="#ffffff"/>

  <!-- Usuario (pill) -->
  <rect x="28" y="112" width="110" height="44" rx="22" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="83" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111">Usuario</text>

  <!-- Arrow: Usuario -> Vercel -->
  <line x1="138" y1="134" x2="198" y2="134" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Vercel -->
  <rect x="205" y="108" width="150" height="52" rx="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="280" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111">Vercel</text>

  <!-- Label over arrow: SPA / HTTPS -->
  <line x1="355" y1="134" x2="430" y2="134" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="362" y="112" width="58" height="20" rx="3" fill="#e8e8e8"/>
  <text x="391" y="126" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#111">HTTPS</text>

  <!-- Lambda Function URL -->
  <rect x="437" y="100" width="210" height="68" rx="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="542" y="130" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111">Lambda Function URL</text>
  <text x="542" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#333">/health · /metrics · /predict</text>

  <!-- Arrow to S3 with label -->
  <line x1="647" y1="134" x2="742" y2="134" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="658" y="108" width="72" height="20" rx="3" fill="#e8e8e8"/>
  <text x="694" y="122" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#111">GetObject</text>

  <!-- S3 Model (cylinder) -->
  <g transform="translate(760, 92)">
    <!-- cylinder body -->
    <ellipse cx="70" cy="18" rx="70" ry="16" fill="#fff" stroke="#111" stroke-width="2"/>
    <path d="M0 18 V74" fill="none" stroke="#111" stroke-width="2"/>
    <path d="M140 18 V74" fill="none" stroke="#111" stroke-width="2"/>
    <ellipse cx="70" cy="74" rx="70" ry="16" fill="#fff" stroke="#111" stroke-width="2"/>
    <rect x="0" y="18" width="140" height="56" fill="#fff"/>
    <!-- redraw sides over fill -->
    <path d="M0 18 V74" fill="none" stroke="#111" stroke-width="2"/>
    <path d="M140 18 V74" fill="none" stroke="#111" stroke-width="2"/>
    <ellipse cx="70" cy="18" rx="70" ry="16" fill="#fff" stroke="#111" stroke-width="2"/>
    <ellipse cx="70" cy="74" rx="70" ry="16" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="70" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111">S3 Model</text>
  </g>

  <!-- Optional note under Lambda: React SPA detail -->
  <text x="280" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#555">React SPA</text>
  <text x="542" y="198" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#555">Random Forest inference</text>
  <text x="830" y="210" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#555">joblib · /tmp cache</text>
</svg>
